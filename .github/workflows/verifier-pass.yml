name: Verifier pass

# Records a verifier's verdict (PASS, PASS+NOTES or FAIL) on one exact commit
# of an agent-lane pull request, under the verifier badge, so the required
# "Verifier pass" status can't come from the agent that wrote the code.
#
# Who runs it: the daily verifier run, after it reran the checks at that
# commit, ran the rehearsal end to end and read the diff. It dispatches this
# workflow with its verdict; the badge posts it. The script refuses if the
# commit isn't the head any more, the badge or whoever dispatched it wrote any
# of the pull request, the report doesn't name the full commit, or (for a pass)
# lane-guard and keystone aren't green on that commit.
#
# The judge always comes from main, never from the pull request or the branch
# the dispatch named. Settings (Dalaun's, once): environment "verifier" with
# deployment branches limited to main, holding variable VERIFIER_APP_ID and
# secret VERIFIER_APP_KEY for the verifier app, dalaun-finchdagen-verifier, which
# is NOT the badge that writes the loop's pull requests. It needs Commit statuses and Pull requests:
# read and write, and nothing else.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      sha:
        description: The full head commit the verifier ran
        required: true
      verdict:
        description: The verdict
        required: true
        type: choice
        options: [PASS, PASS+NOTES, FAIL]
      note:
        description: One line (needed for PASS+NOTES and FAIL)
        required: false
        default: ''
      report:
        description: The full report, naming the full head commit and each command run with its result
        required: true

permissions:
  contents: read

concurrency:
  group: verifier-pass-${{ inputs.pr }}

jobs:
  post:
    name: Post the verifier's verdict
    runs-on: ubuntu-latest
    environment: verifier
    if: vars.VERIFIER_APP_ID != ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The verifier script's own cases
        run: python3 .github/lane/verifier_pass.py --selftest
      - name: Verifier badge token
        id: badge
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.VERIFIER_APP_ID }}
          private-key: ${{ secrets.VERIFIER_APP_KEY }}
      - name: Post the verdict on that commit and the report on the pull request
        env:
          GH_TOKEN: ${{ steps.badge.outputs.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          VERDICT: ${{ inputs.verdict }}
          NOTE: ${{ inputs.note }}
          REPORT: ${{ inputs.report }}
          SLUG: ${{ steps.badge.outputs.app-slug }}
          ASKED_BY: ${{ github.actor }}
        run: |
          printf '%s\n' "$REPORT" > "$RUNNER_TEMP/report.md"
          python3 .github/lane/verifier_pass.py --post --pr "$PR" --sha "$SHA" \
            --as "${SLUG}[bot]" --verdict "$VERDICT" --note "$NOTE" \
            --report "$RUNNER_TEMP/report.md" --asked-by "$ASKED_BY"
