name: Keystone check

on:
  push:
    paths: ['**.ttl', 'validate_keystone.py', 'validate_owl_lint.py', 'decide_spend.py', 'validate_figures.py', 'grade_stories.py', 'validate_fail_closed.py', 'fast_sparql.py', 'tests/**', 'rehearsal/synthetic/**']
  # Every pull request, no path filter: "keystone" is a required check, and a
  # required check that never starts leaves a pull request waiting forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rdflib pyshacl
      - name: OWL lint (hasValue on a class, restrictions on rdf:type, doubled onProperty)
        run: python3 validate_owl_lint.py
      - name: Run keystone and cascade checks against the answer key
        run: python3 validate_keystone.py
      - name: OWL lint on the decision model
        run: python3 validate_owl_lint.py decision/*.ttl tests/decision/*.ttl tests/decision/giftlaw-stories/*.ttl
      - name: Grade the spend decision cases against their answer key
        run: python3 decide_spend.py
      - name: Grade the same cases under insider branch B
        run: python3 decide_spend.py --branch B
      - name: Show what flips between the insider branches
        run: python3 decide_spend.py --compare
      - name: Sweep the family trust's settings one at a time
        run: python3 decide_spend.py --sweep
      - name: Grade the GiftLaw example stories and show where the page and the checks disagree
        run: python3 grade_stories.py
      - name: Check every figure is dated, current and matches the check that uses it
        run: python3 validate_figures.py
      - name: Show the figures check catches undated, stale, drifted and mismatched figures
        run: python3 validate_figures.py --selftest
      - name: Fail closed - delete or misspell each fact on every case, graded in place; no copy may be Allow when it must not be
        run: python3 validate_fail_closed.py
      - name: Show the fail-closed test catches fail-opens when FC0 is off
        run: python3 validate_fail_closed.py --selftest
      - name: Synthetic rehearsal year - regenerate every scenario twice and prove it is reproducible and labelled
        run: python3 rehearsal/synthetic/synthetic_year.py --check
      - name: Rehearsal runner selftest - tax figures, structure cases SK1-SK14 and rename invariance
        run: python3 rehearsal/synthetic/rehearsal_run.py --selftest
      - name: Run arm A and arm B on the synthetic year
        run: |
          python3 rehearsal/synthetic/synthetic_year.py --out /tmp/ledgers
          python3 rehearsal/synthetic/rehearsal_run.py --ledgers /tmp/ledgers
      - name: Pinned rehearsal checks (Dalaun's lane) - tax figures, structure answer key, w stays 0
        run: python3 tests/rehearsal/pinned_checks.py
      - name: The score ledger's newest rows are what this engine computes
        run: python3 tests/rehearsal/check_ledger.py
      - name: Lane guard's own cases
        run: python3 .github/lane/lane_guard.py --selftest
      - name: Verifier pass's own cases
        run: python3 .github/lane/verifier_pass.py --selftest
      - name: Transition twin's own cases
        run: python3 rehearsal/transition_twin.py --selftest
      - name: Blind-goal adversarial path - builder never sees the key, closest bad pattern and keystone at every step, counsel packet, grader says pass or fail only
        run: python3 tests/rehearsal/blind_path.py --selftest
      - name: No counsel-private material in the public repo
        run: python3 tests/rehearsal/blind_path.py --privacy-scan
      - name: Vocabulary and compliance layers stay separated, with the same content as the original
        run: python3 validate_separated.py
